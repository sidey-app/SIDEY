name: Database CI

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/supabase/**'
      - '.github/workflows/database.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/supabase/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Supabase reset and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset migrations from scratch
        run: supabase db reset --local

      - name: Run database tests
        run: supabase test db

      - name: Run concurrent transaction tests
        run: ./scripts/supabase/test_concurrency.sh

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
