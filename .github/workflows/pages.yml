name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'release/macos.json'
      - 'release/windows.json'
      - 'website/**'
      - 'scripts/website/**'
      - 'scripts/validate_pixel_assets.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'release/macos.json'
      - 'release/windows.json'
      - 'website/**'
      - 'scripts/website/**'
      - 'scripts/validate_pixel_assets.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test commerce pages
        run: node --test website/tests/*.test.mjs

      - name: Validate central pixel assets and mirrors
        run: python3 ./scripts/validate_pixel_assets.py

      - name: Test Windows release metadata preparation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content ./release/windows.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $installerName = "SIDEY-Windows-x64-v${version}-Setup.exe"
          New-Item -ItemType Directory -Path ./build/pages-test-release -Force |
            Out-Null
          Copy-Item ./release/windows.json `
            "./build/pages-test-release/$installerName"

          ./scripts/website/prepare-windows-release.ps1 `
            -WebsiteDir ./website `
            -OutputDir ./build/pages-test-site `
            -ReleaseManifest ./release/windows.json `
            -ReleaseInstaller "./build/pages-test-release/$installerName"

          $published = Get-Content ./build/pages-test-site/windows-latest.json -Raw |
            ConvertFrom-Json
          if ([string]$published.sha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Generated Windows SHA-256 is invalid.'
          }
          foreach ($page in @('index.html', 'en/index.html')) {
            $html = Get-Content "./build/pages-test-site/$page" -Raw
            if ($html -notmatch '<a class="button button-secondary" id="windows-download-action"') {
              throw "Generated Windows download link is missing: $page"
            }
          }

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify published macOS release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Get-Content ./release/macos.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $tag = "v$version"
          $requiredAssets = @(
            "SIDEY-macOS-arm64-$tag.dmg",
            "SIDEY-macOS-arm64-$tag.zip"
          )
          $release = gh release view $tag --json isDraft,isPrerelease,assets |
            ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) {
            throw "macOS release must be a published regular release: $tag"
          }
          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          foreach ($asset in $requiredAssets) {
            if ($assetNames -cnotcontains $asset) {
              throw "macOS release is missing $asset"
            }
          }

      - name: Prepare verified Windows release metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Get-Content ./release/windows.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $tag = "windows-v$version"
          $installerName = "SIDEY-Windows-x64-v${version}-Setup.exe"

          $release = gh release view $tag --json isDraft,isPrerelease,assets |
            ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) {
            throw "Windows release must be a published regular release: $tag"
          }
          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          if ($assetNames.Count -ne 1 -or $assetNames[0] -cne $installerName) {
            throw "Windows release must contain only $installerName"
          }

          New-Item -ItemType Directory -Path ./build/windows-pages-release -Force |
            Out-Null
          gh release download $tag `
            --pattern $installerName `
            --dir ./build/windows-pages-release `
            --clobber

          ./scripts/website/prepare-windows-release.ps1 `
            -WebsiteDir ./website `
            -OutputDir ./build/pages-site `
            -ReleaseManifest ./release/windows.json `
            -ReleaseInstaller "./build/windows-pages-release/$installerName"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages-site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
