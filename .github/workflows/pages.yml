name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "scripts/website/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "scripts/website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Windows"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test commerce pages
        run: node --test website/tests/*.test.mjs

      - name: Test Windows release metadata preparation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content ./website/windows-latest.json -Raw |
            ConvertFrom-Json
          $msiName = "SIDEY-Windows-x64-v$($manifest.version).msi"
          New-Item -ItemType Directory -Path ./build/pages-test-release -Force |
            Out-Null
          Copy-Item ./website/windows-latest.json `
            "./build/pages-test-release/$msiName"

          ./scripts/website/prepare-windows-release.ps1 `
            -WebsiteDir ./website `
            -OutputDir ./build/pages-test-site `
            -ReleaseMsi "./build/pages-test-release/$msiName"

          $published = Get-Content ./build/pages-test-site/windows-latest.json -Raw |
            ConvertFrom-Json
          if ([string]$published.sha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Generated Windows SHA-256 is invalid.'
          }
          foreach ($page in @('index.html', 'en/index.html')) {
            $html = Get-Content "./build/pages-test-site/$page" -Raw
            if ($html -notmatch '<a class="button button-secondary" id="windows-download-action"') {
              throw "Generated Windows download link is missing: $page"
            }
          }

  deploy:
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event != 'pull_request'))
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare verified Windows release metadata
        id: windows_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content ./website/windows-latest.json -Raw |
            ConvertFrom-Json
          $tag = [string]$manifest.tag
          $version = [string]$manifest.version
          $msiName = "SIDEY-Windows-x64-v$version.msi"

          $releaseJson = gh release view $tag --json isDraft,isPrerelease,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Windows Release is not published yet: $tag"
            "available=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) {
            throw "Windows Release must be a regular release: $tag"
          }
          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          if ($assetNames.Count -ne 1 -or $assetNames[0] -ne $msiName) {
            throw "Windows Release must contain only $msiName"
          }

          New-Item -ItemType Directory -Path ./build/windows-pages-release -Force |
            Out-Null
          gh release download $tag `
            --pattern $msiName `
            --dir ./build/windows-pages-release `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Windows Release MSI download failed: $tag/$msiName"
          }

          ./scripts/website/prepare-windows-release.ps1 `
            -WebsiteDir ./website `
            -OutputDir ./build/pages-site `
            -ReleaseMsi "./build/windows-pages-release/$msiName"
          "available=true" >> $env:GITHUB_OUTPUT

      - name: Configure GitHub Pages
        if: steps.windows_release.outputs.available == 'true'
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        if: steps.windows_release.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages-site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        if: steps.windows_release.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
