name: SIDEY CI (Windows build and tests)

# ci.yml owns automatic pull request and main validation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-and-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Windows release metadata
        run: >-
          python ./scripts/skills/verify_release_consistency.py
          --platform windows
          --allow-unreleased-source

      - name: Validate central pixel assets and mirrors
        run: python ./scripts/validate_pixel_assets.py

      - name: Verify Windows product catalog and assets
        run: python -X utf8 ./windows/tools/sync_product_assets.py --check

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'

      - name: Restore
        run: dotnet restore windows/SIDEY.Windows.slnx

      - name: Verify formatting
        run: dotnet format windows/SIDEY.Windows.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build windows/SIDEY.Windows.slnx --configuration Release --no-restore

      - name: Test
        id: tests
        run: dotnet test windows/SIDEY.Windows.slnx --configuration Release --no-restore --no-build --logger trx --collect:"XPlat Code Coverage" --settings windows/coverlet.runsettings --results-directory artifacts/coverage

      - name: Publish and verify self-contained payload
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish windows/src/Sidey.App/Sidey.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --no-restore -p:PublishSingleFile=false `
            --output build/windows/publish
          ./scripts/windows/tests/Test-SelfContainedPublish.ps1 -PublishDirectory ./build/windows/publish

      - name: Run Windows app smoke
        env:
          SIDEY_STORE_PREVIEW_SMOKE: '1'
          SIDEY_OVERLAY_STARTUP_SMOKE: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/windows/tests/Test-PublishedApplication.ps1 -PublishDirectory ./build/windows/publish -TimeoutSeconds 120

      - name: Compile NSIS installer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          winget install NSIS.NSIS --exact --version 3.12 --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          $version = ([xml](Get-Content ./windows/src/Sidey.App/Sidey.App.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ }
          ./scripts/windows/New-WindowsInstaller.ps1 -PublishDirectory ./build/windows/publish `
            -OutputDirectory ./build/windows/artifacts -Version $version

      - name: Upload coverage
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v5
        with:
          name: windows-code-coverage
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload manual test candidate
        uses: actions/upload-artifact@v5
        with:
          name: sidey-windows-candidate-${{ github.sha }}
          path: |
            build/windows/artifacts/*Setup.exe
          if-no-files-found: error
          retention-days: 14
