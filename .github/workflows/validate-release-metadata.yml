name: Validate release metadata

on:
  # PR and main validation is owned by validate-change.yml to avoid duplicate runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Release metadata validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify release manifests and mirrors
        run: >-
          ./scripts/skills/verify_release_consistency.sh
          --allow-pending-appcast
          --allow-unreleased-source
