name: Windows native

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'scripts/windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'scripts/windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '검증 전 Windows 테스트용 GitHub pre-release 게시'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: windows
        run: dotnet restore SIDEY.Windows.slnx

      - name: Core tests
        run: dotnet test windows/tests/Sidey.Core.Tests/Sidey.Core.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=sidey-core.trx"

      - name: Windows platform policy tests
        run: dotnet test windows/tests/Sidey.Platform.Windows.Tests/Sidey.Platform.Windows.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=sidey-platform.trx"

      - name: Build Windows solution
        run: dotnet build windows/SIDEY.Windows.slnx --configuration Release --no-restore

      - name: Publish self-contained x64
        run: >-
          dotnet publish windows/src/Sidey.App/Sidey.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:Version=0.3.0-alpha.1
          --output build/windows/publish

      - name: Build offline Setup.exe and SHA-256
        run: >-
          ./scripts/windows/package.ps1
          -PublishDir ./build/windows/publish
          -OutDir ./build/windows/artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: windows/tests/**/TestResults/*.trx
          if-no-files-found: warn

      - name: Upload Windows Setup candidate
        uses: actions/upload-artifact@v4
        with:
          name: SIDEY-Windows-x64-v0.3.0-alpha.1-Setup-candidate
          path: |
            build/windows/artifacts/SIDEY-Windows-x64-v0.3.0-alpha.1-Setup.exe
            build/windows/artifacts/SIDEY-Windows-x64-v0.3.0-alpha.1-Setup.exe.sha256
          if-no-files-found: error

      - name: Upload CI-only MSI
        uses: actions/upload-artifact@v4
        with:
          name: SIDEY-Windows-x64-v0.3.0-alpha.1-internal-msi
          path: build/windows/artifacts/internal/*.msi
          if-no-files-found: error

  publish-pre-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build-test-package
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download verified Setup candidate
        uses: actions/download-artifact@v4
        with:
          name: SIDEY-Windows-x64-v0.3.0-alpha.1-Setup-candidate
          path: release-assets

      - name: Publish Windows testing pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'v0.3.0-alpha.1'
          $setup = './release-assets/SIDEY-Windows-x64-v0.3.0-alpha.1-Setup.exe'
          $checksum = "$setup.sha256"
          $notes = @'
          Windows 11 25H2(build 26200)+ x64 기기 테스트용 pre-release입니다.

          - 코드 서명이 없는 alpha입니다. SmartScreen 경고가 버전마다 반복될 수 있고 Smart App Control 또는 조직 정책이 실행을 차단할 수 있습니다.
          - Windows 실기 30분, 12명 2시간, 20노드 30분, macOS↔Windows 상호운용 및 설치 수명주기 검증은 아직 완료되지 않았습니다. 공개 준비 완료판이 아닙니다.
          - 사용자별로 `%LOCALAPPDATA%\Programs\SIDEY`에 설치하며 관리자 권한을 요구하지 않습니다.
          - SHA-256 확인: `Get-FileHash .\SIDEY-Windows-x64-v0.3.0-alpha.1-Setup.exe -Algorithm SHA256`
          '@

          gh release create $tag $setup $checksum `
            --target $env:GITHUB_SHA `
            --title 'SIDEY Windows v0.3.0-alpha.1 — Device Test' `
            --notes $notes `
            --prerelease
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows testing pre-release 게시 실패'
          }
