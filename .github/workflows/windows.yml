name: Windows CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'release/windows.json'
      - 'windows/**'
      - 'scripts/windows/**'
      - 'scripts/validate_pixel_assets.py'
      - 'scripts/verify_release_consistency.py'
      - 'shared/character-throw/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'release/windows.json'
      - 'windows/**'
      - 'scripts/windows/**'
      - 'scripts/validate_pixel_assets.py'
      - 'scripts/verify_release_consistency.py'
      - 'shared/character-throw/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      source_version: ${{ steps.source.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Windows release metadata
        run: >-
          python ./scripts/verify_release_consistency.py
          --platform windows
          --allow-unreleased-source

      - name: Read Windows source version
        id: source
        run: |
          [xml]$project = Get-Content ./windows/src/Sidey.App/Sidey.App.csproj -Raw
          $properties = $project.Project.PropertyGroup |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_.Version) } |
            Select-Object -First 1
          $version = [string]$properties.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Windows source version must contain three numeric parts.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate central pixel assets and mirrors
        run: python ./scripts/validate_pixel_assets.py

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore windows/SIDEY.Windows.slnx

      - name: Verify formatting
        run: dotnet format windows/SIDEY.Windows.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build windows/SIDEY.Windows.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test windows/SIDEY.Windows.slnx --configuration Release --no-restore --no-build --logger trx --collect:"XPlat Code Coverage" --settings windows/coverlet.runsettings --results-directory artifacts/coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-code-coverage
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error

  package-candidate:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore development-commerce candidate
        run: dotnet restore windows/SIDEY.Windows.slnx

      - name: Build development-commerce candidate
        run: >-
          dotnet build windows/SIDEY.Windows.slnx
          --configuration Debug
          --no-restore
          -p:SideyDevelopmentCommerce=true

      - name: Test development-commerce candidate
        run: >-
          dotnet test windows/SIDEY.Windows.slnx
          --configuration Debug
          --no-restore
          --no-build
          -p:SideyDevelopmentCommerce=true

      - name: Install pinned NSIS compiler
        id: nsis
        run: |
          winget install NSIS.NSIS `
            --exact `
            --version 3.12 `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
            throw 'NSIS 3.12 makensis.exe was not installed.'
          }
          "makensis_path=$makensis" >> $env:GITHUB_OUTPUT

      - name: Build Setup EXE candidate
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish windows/src/Sidey.App/Sidey.App.csproj `
            --configuration Debug `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -p:SideyDevelopmentCommerce=true `
            --output build/windows/publish
          ./scripts/windows/smoke-launch.ps1 `
            -PublishDir ./build/windows/publish
          ./scripts/windows/package.ps1 `
            -PublishDir ./build/windows/publish `
            -OutDir ./build/windows/artifacts `
            -Version '${{ needs.validate.outputs.source_version }}' `
            -MakensisPath '${{ steps.nsis.outputs.makensis_path }}'

      - name: Upload private Windows candidate
        uses: actions/upload-artifact@v5
        with:
          name: windows-candidate-${{ needs.validate.outputs.source_version }}
          path: build/windows/artifacts/SIDEY-Windows-x64-v${{ needs.validate.outputs.source_version }}-Setup.exe
          if-no-files-found: error
          retention-days: 7
