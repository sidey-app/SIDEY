name: Windows

on:
  push:
    branches: [main]
    tags: ['windows-v*']
    paths:
      - 'windows/**'
      - 'scripts/windows/**'
      - 'website/windows-latest.json'
      - 'website/windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'scripts/windows/**'
      - 'website/windows-latest.json'
      - 'website/windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '검증한 Windows 후보를 GitHub pre-release로 게시'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      bundle_version: ${{ steps.metadata.outputs.bundle_version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read Windows version
        id: metadata
        run: |
          [xml]$project = Get-Content ./windows/src/Sidey.App/Sidey.App.csproj -Raw
          $properties = $project.Project.PropertyGroup |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_.Version) } |
            Select-Object -First 1
          $version = [string]$properties.Version
          $bundleVersion = [string]$properties.FileVersion
          if ([string]::IsNullOrWhiteSpace($version) -or
              [string]::IsNullOrWhiteSpace($bundleVersion)) {
            throw 'Windows version metadata is missing.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $expectedTag = "windows-v$version"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag must match the project version: $expectedTag"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "bundle_version=$bundleVersion" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore windows/SIDEY.Windows.slnx

      - name: Verify formatting
        run: dotnet format windows/SIDEY.Windows.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build windows/SIDEY.Windows.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test windows/SIDEY.Windows.slnx --configuration Release --no-restore --no-build --logger trx

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/windows-v')
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build signed installer candidate
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '${{ needs.validate.outputs.version }}'
          $bundleVersion = '${{ needs.validate.outputs.bundle_version }}'

          dotnet restore windows/SIDEY.Windows.slnx
          dotnet restore windows/installer/Sidey.Msi/Sidey.Msi.wixproj
          dotnet restore windows/installer/Sidey.Bundle/Sidey.Bundle.wixproj
          dotnet publish windows/src/Sidey.App/Sidey.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            --output build/windows/publish
          ./scripts/windows/smoke-launch.ps1 `
            -PublishDir ./build/windows/publish
          ./scripts/windows/package.ps1 `
            -PublishDir ./build/windows/publish `
            -OutDir ./build/windows/artifacts `
            -Version $version `
            -BundleVersion $bundleVersion

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: SIDEY-Windows-x64-v${{ needs.validate.outputs.version }}
          path: |
            build/windows/artifacts/SIDEY-Windows-x64-v${{ needs.validate.outputs.version }}-Setup.exe
            build/windows/artifacts/SIDEY-Windows-x64-v${{ needs.validate.outputs.version }}-Setup.exe.sha256
            build/windows/artifacts/SIDEY-Windows-x64-v${{ needs.validate.outputs.version }}-Test.msi
            build/windows/artifacts/SIDEY-Windows-x64-v${{ needs.validate.outputs.version }}-Test.msi.sha256
            build/windows/artifacts/SIDEY-SelfSigned-CodeSigning.cer
          if-no-files-found: error
          retention-days: 7

  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
      || startsWith(github.ref, 'refs/tags/windows-v')
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Download Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: SIDEY-Windows-x64-v${{ needs.validate.outputs.version }}
          path: release-assets

      - name: Publish Windows testing pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = '${{ needs.validate.outputs.version }}'
          $tag = "windows-v$version"
          $setup = "./release-assets/SIDEY-Windows-x64-v$version-Setup.exe"
          $checksum = "$setup.sha256"
          $certificate = './release-assets/SIDEY-SelfSigned-CodeSigning.cer'
          $notes = "./docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Windows release notes are missing: $notes"
          }

          gh release create $tag $setup $checksum $certificate `
            --target $env:GITHUB_SHA `
            --title "SIDEY Windows v$version — Device Test" `
            --notes-file $notes `
            --prerelease
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows testing pre-release 게시 실패'
          }
