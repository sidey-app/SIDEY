name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'release/windows.json'
      - 'windows/**'
      - 'scripts/windows/**'
      - 'scripts/validate_pixel_assets.py'
      - 'scripts/verify_release_consistency.py'
      - 'website/src/pages/ko/terms.md'
      - 'shared/character-throw/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'release/windows.json'
      - 'windows/**'
      - 'scripts/windows/**'
      - 'scripts/validate_pixel_assets.py'
      - 'scripts/verify_release_consistency.py'
      - 'website/src/pages/ko/terms.md'
      - 'shared/character-throw/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Windows release metadata
        run: >-
          python ./scripts/verify_release_consistency.py
          --platform windows
          --allow-unreleased-source

      - name: Validate central pixel assets and mirrors
        run: python ./scripts/validate_pixel_assets.py

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore windows/SIDEY.Windows.slnx

      - name: Verify formatting
        run: dotnet format windows/SIDEY.Windows.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build windows/SIDEY.Windows.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test windows/SIDEY.Windows.slnx --configuration Release --no-restore --no-build --logger trx --collect:"XPlat Code Coverage" --settings windows/coverlet.runsettings --results-directory artifacts/coverage

      - name: Test runtime prerequisites and migration cleanup
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/windows/test-prerequisites.ps1

      - name: Publish and verify framework-dependent payload
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish windows/src/Sidey.App/Sidey.App.csproj `
            --configuration Release --runtime win-x64 --self-contained false `
            --no-restore -p:WindowsAppSDKSelfContained=false -p:PublishSingleFile=false `
            --output build/windows/publish
          ./scripts/windows/verify-framework-publish.ps1 -PublishDir ./build/windows/publish
          ./scripts/windows/test-framework-publish.ps1 -PublishDir ./build/windows/publish

      - name: Install prerequisites and smoke test the published app
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File ./windows/installer/Sidey.Setup/SetupRuntime.ps1 -ProvisionAllUsers
          if ($LASTEXITCODE -ne 0) { throw 'Runtime prerequisites are not ready for the startup smoke test.' }
          ./scripts/windows/smoke-launch.ps1 -PublishDir ./build/windows/publish -TimeoutSeconds 60

      - name: Compile NSIS installer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          winget install NSIS.NSIS --exact --version 3.12 --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          $version = (Get-Content ./release/windows.json -Raw | ConvertFrom-Json).version
          ./scripts/windows/package.ps1 -PublishDir ./build/windows/publish `
            -OutDir ./build/windows/artifacts -Version $version

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-code-coverage
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error
