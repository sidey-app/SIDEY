<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIDEY — Speech Bubbles</title>
    <meta name="description" content="SIDEY language selection">
    <link rel="alternate" hreflang="ko" href="https://sidey-app.github.io/SIDEY/ko/store/bubbles/">
    <link rel="alternate" hreflang="en" href="https://sidey-app.github.io/SIDEY/en/store/bubbles/">
    <link rel="alternate" hreflang="ja" href="https://sidey-app.github.io/SIDEY/ja/store/bubbles/">
    <link rel="alternate" hreflang="zh-Hant" href="https://sidey-app.github.io/SIDEY/zh-hant/store/bubbles/">
    <link rel="alternate" hreflang="x-default" href="https://sidey-app.github.io/SIDEY/store/bubbles/">
    <script>(function(){const koreanTarget = "/SIDEY/ko/store/bubbles/";
const englishTarget = "/SIDEY/en/store/bubbles/";
const japaneseTarget = "/SIDEY/ja/store/bubbles/";
const traditionalChineseTarget = "/SIDEY/zh-hant/store/bubbles/";

      (() => {
        const preferredLanguage = navigator.languages?.[0] ?? navigator.language ?? "";
        const language = preferredLanguage.toLowerCase();
        const destination = language.startsWith("ko")
          ? koreanTarget
          : language.startsWith("ja")
            ? japaneseTarget
            : language.startsWith("zh-hant") || language.startsWith("zh-tw") || language.startsWith("zh-hk") || language.startsWith("zh-mo")
              ? traditionalChineseTarget
              : englishTarget;
        const target = new URL(destination, window.location.origin);
        target.search = window.location.search;
        target.hash = window.location.hash;
        window.location.replace(target.href);
      })();
    })();</script></head>
  <body>
    <main>
      <p>
        <a href="/SIDEY/ko/store/bubbles/" lang="ko" hreflang="ko">한국어</a>
        ·
        <a href="/SIDEY/en/store/bubbles/" lang="en" hreflang="en">English</a>
        ·
        <a href="/SIDEY/ja/store/bubbles/" lang="ja" hreflang="ja">日本語</a>
        ·
        <a href="/SIDEY/zh-hant/store/bubbles/" lang="zh-Hant" hreflang="zh-Hant">繁體中文</a>
      </p>
    </main>
  </body>
</html>
